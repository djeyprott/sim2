name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and test
        run: dotnet test sim2.sln --configuration Release
      - name: Headless run of 12,000 years
        run: dotnet run --project src/Sim.Headless -c Release -- --world data/earth.world --seed 1 --years 12000
