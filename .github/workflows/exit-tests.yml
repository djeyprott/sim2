name: Exit tests

# The milestone exit tests: long runs of the full simulation on Earth with 10 seeds each.
# They run separately from CI so ordinary changes get quick results, and only when started by
# hand (gh workflow run exit-tests.yml), all three suites unless chosen. Runs with farming go 9,000 years (milestone 4) and take
# about two hours a suite.
on:
  workflow_dispatch:
    inputs:
      suites:
        description: Suites to run, as a JSON list
        default: '["EarthRealHomelandTests", "EarthRandomHomelandTests", "EarthNoFarmingTests"]'

jobs:
  exit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event.inputs.suites || '["EarthRealHomelandTests", "EarthRandomHomelandTests", "EarthNoFarmingTests"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run ${{ matrix.suite }}
        run: >
          dotnet test sim2.sln --configuration Release
          --filter "FullyQualifiedName~${{ matrix.suite }}"
          --logger "console;verbosity=detailed"
