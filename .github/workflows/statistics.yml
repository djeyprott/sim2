name: Statistics

# Runs the headless simulation for a few seeds and commits the yearly statistics to docs/stats,
# so runs can be compared and tuned without downloading anything.
on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Seeds to run (space-separated)
        default: '1 2 3'
      homelands:
        description: Crop homelands (real, random or both)
        default: 'real random'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/content/**'
      - '.github/workflows/statistics.yml'

concurrency:
  group: statistics
  cancel-in-progress: true

jobs:
  statistics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/Sim.Headless -c Release
      - name: Run the seeds (1 to 3 unless chosen) with real and random crop homelands, 9,000 years each
        # The six runs go side by side (each is single-threaded); each run's timings by system
        # are kept next to its statistics.
        timeout-minutes: 300
        run: |
          mkdir -p docs/stats
          pids=""
          for homelands in ${{ github.event.inputs.homelands || 'real random' }}; do
            for seed in ${{ github.event.inputs.seeds || '1 2 3' }}; do
              dotnet run --project src/Sim.Headless -c Release --no-build -- \
                --world data/earth.world --seed $seed --homelands $homelands --years 9000 \
                --stats docs/stats/$homelands-seed$seed.csv > docs/stats/$homelands-seed$seed-timings.txt 2>&1 &
              pids="$pids $!"
            done
          done
          status=0
          for pid in $pids; do wait $pid || status=1; done
          tail -n 25 docs/stats/*-timings.txt
          exit $status
      - name: Commit the statistics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stats
          git diff --cached --quiet && exit 0
          git commit -m "Update run statistics"
          git pull --rebase
          git push
